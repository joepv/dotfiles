# Solarized Osaka for Yazi
# Based on craftzdog/solarized-osaka.nvim

[app]
overall = { bg = "#00141a" }


# ────────────────────────────────────────────────────────────
# Manager
# ────────────────────────────────────────────────────────────

[mgr]

cwd = { fg = "#adb8b8", bold = true }

find_keyword = {
    fg = "#00141a",
    bg = "#b28600",
    bold = true
}

find_position = {
    fg = "#b28600",
    bold = true
}

symlink_target = {
    fg = "#6d72c5",
    italic = true
}

marker_copied = {
    fg = "#00141a",
    bg = "#859900"
}

marker_cut = {
    fg = "#00141a",
    bg = "#dc312e"
}

marker_marked = {
    fg = "#00141a",
    bg = "#b28600"
}

marker_selected = {
    fg = "#00141a",
    bg = "#2aa298"
}

count_copied = {
    fg = "#859900",
    bold = true
}

count_cut = {
    fg = "#dc312e",
    bold = true
}

count_selected = {
    fg = "#2aa298",
    bold = true
}

border_symbol = "│"

border_style = {
    fg = "#073541"
}


# ────────────────────────────────────────────────────────────
# Indicator
# ────────────────────────────────────────────────────────────

[indicator]

