    fg = "#2aa298"
}

desc = {
    fg = "#9fabad"
}

hovered = {
    fg = "#00141a",
    bg = "#2aa298"
}

footer = {
    fg = "#647a82"
}


# ────────────────────────────────────────────────────────────
# File types
# ────────────────────────────────────────────────────────────

[filetype]

rules = [

    # Directories
    { url = "*/", fg = "#b28600", bold = true },

    # Symlinks
    { url = "*", is = "link", fg = "#6d72c5" },

    # Broken symlinks
    { url = "*", is = "orphan", fg = "#dc312e", bold = true },

    # Executables
    { url = "*", is = "exec", fg = "#859900", bold = true },

    # Images
    { mime = "image/*", fg = "#d33682" },

    # Video
    { mime = "video/*", fg = "#6d72c5" },

    # Audio
    { mime = "audio/*", fg = "#6d72c5" },

    # Archives
    { mime = "application/zip", fg = "#ca4c16" },
    { mime = "application/gzip", fg = "#ca4c16" },
    { mime = "application/x-gzip", fg = "#ca4c16" },
    { mime = "application/x-tar", fg = "#ca4c16" },
    { mime = "application/x-bzip2", fg = "#ca4c16" },
    { mime = "application/x-xz", fg = "#ca4c16" },
    { mime = "application/x-7z-compressed", fg = "#ca4c16" },
    { mime = "application/x-rar", fg = "#ca4c16" },

    # Documents / text
    { mime = "text/*", fg = "#9fabad" },

    # Empty
    { mime = "inode/empty", fg = "#647a82" },

    # Default
    { url = "*", fg = "#9fabad" }
]
